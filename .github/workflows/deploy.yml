name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Theresa_birthday
        working-directory: Theresa_birthday
        run: npm install && npm run build

      - name: Build valentine
        working-directory: valentine
        run: npm install && npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/Theresa_birthday _site/valentine
          cp -r Theresa_birthday/dist/. _site/Theresa_birthday/
          cp -r valentine/dist/. _site/valentine/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
